appId: com.dshdock.app
productName: DSHDock
copyright: Copyright © 2025 dsh-dock
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - resources/icon.png
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
  icon: resources/icon.png
  artifactName: ${productName}-V${version}-Windows-${env.ARCH_NAME}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: DSHDock
# mac:
#   target:
#     - target: dmg
#   category: public.app-category.developer-tools
#   icon: resources/icon.png
#   artifactName: ${productName}-V${version}-macOS-${env.ARCH_NAME}.${ext}
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Development
  maintainer: dsh-dock
  artifactName: ${productName}-V${version}-Linux-${env.ARCH_NAME}.${ext}
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
