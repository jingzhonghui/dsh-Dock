name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            arch_name: amd64
            build_cmd: npm run build:win:ci
            artifact_glob: |
              release/*.exe
          - name: windows-arm64
            os: windows-11-arm
            arch_name: arm64
            build_cmd: npm run build:win:ci
            artifact_glob: |
              release/*.exe
          - name: linux
            os: ubuntu-latest
            arch_name: amd64
            build_cmd: npm run build:linux:ci
            artifact_glob: |
              release/*.AppImage
              release/*.deb
          - name: linux-arm64
            os: ubuntu-22.04-arm
            arch_name: arm64
            build_cmd: npm run build:linux:ci
            artifact_glob: |
              release/*.AppImage
              release/*.deb
          # macOS packaging can be enabled later when signing/notarization is ready.
          # - name: macos
          #   os: macos-14
          #   arch_name: universal
          #   build_cmd: npm run build:mac:ci -- --universal
          #   artifact_glob: |
          #     release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        if: startsWith(matrix.name, 'linux')
        shell: bash
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/ghc-* /usr/local/share/boost
          sudo apt-get clean
          sudo docker system prune -af --volumes 2>/dev/null || true
          df -h /

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Sync version from tag
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.version = process.env.GITHUB_REF_NAME.replace(/^v/, '')
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH_NAME: ${{ matrix.arch_name }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.build_cmd }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-release
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -maxdepth 3 -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            # artifacts/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          {
            echo '## Release published successfully'
            echo ''
            echo "Tag: ${{ github.ref_name }}"
            echo 'Assets uploaded from the `release/` directory.'
          } >> "$GITHUB_STEP_SUMMARY"
